name: Build Minecraft 26.3

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Build
        run: ./gradlew build --no-daemon --stacktrace
      - name: Install software graphics drivers
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dri libegl1 mesa-vulkan-drivers mesa-utils xvfb
      - name: Client startup and mixin audit
        timeout-minutes: 6
        env:
          LIBGL_ALWAYS_SOFTWARE: 'true'
          SDL_VIDEO_X11_FORCE_EGL: '1'
        run: python3 .github/scripts/smoke_client.py
      - name: Upload client logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-smoke-logs
          path: |
            build/client-smoke.log
            run/logs/latest.log
      - name: Upload mod
        uses: actions/upload-artifact@v4
        with:
          name: hasteless-bedrock-breaker-mc26.3
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
